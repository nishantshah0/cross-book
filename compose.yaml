# Local demo only: no authentication. Bind services to loopback.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: papertrader
      POSTGRES_USER: papertrader
      POSTGRES_PASSWORD: papertrader
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U papertrader -d papertrader"]
      interval: 5s
      timeout: 3s
      retries: 15
  app:
    profiles: [app]
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/papertrader
      DB_USERNAME: papertrader
      DB_PASSWORD: papertrader
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      FEED_MODE: ${FEED_MODE:-demo}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
      FEED_INTERVAL_MS: ${FEED_INTERVAL_MS:-15000}
      FEED_SEED: ${FEED_SEED:-}
      CLOCK_MODE: ${CLOCK_MODE:-system}
      CLOCK_START: ${CLOCK_START:-2026-01-05T14:30:00Z}
      MARKET_MODE: ${MARKET_MODE:-house}
      HOUSE_SPREAD_BPS: ${HOUSE_SPREAD_BPS:-10}
      HOUSE_IMPACT_BPS: ${HOUSE_IMPACT_BPS:-10}
      HOUSE_DEPTH_SHARES: ${HOUSE_DEPTH_SHARES:-500}
      HOUSE_IMPACT_DECAY: ${HOUSE_IMPACT_DECAY:-0.25}
      HOUSE_IMBALANCE_BPS: ${HOUSE_IMBALANCE_BPS:-4}
      # AI cheater runs from tools/agent/cheater.py, for the surveillance desk's red-team tab
      RED_TEAM_RUNS_DIR: /red-team
    volumes:
      - ./target/agent:/red-team:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 20
volumes:
  postgres-data:
