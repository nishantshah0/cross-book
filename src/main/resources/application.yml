spring:
  application:
    name: paper-trader
  datasource:
    # only used when running outside compose support, e.g. the packaged jar
    url: ${DB_URL:jdbc:postgresql://localhost:5432/papertrader}
    username: ${DB_USERNAME:papertrader}
    password: ${DB_PASSWORD:papertrader}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # flyway owns the schema
  docker:
    compose:
      lifecycle-management: start-only # leave postgres up between runs
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

papertrader:
  feed:
    mode: ${FEED_MODE:demo}
    api-key: ${FINNHUB_API_KEY:}
    interval-ms: ${FEED_INTERVAL_MS:15000}
    # fixes the demo feed's random walk so a run's prices can be replayed; blank picks
    # a seed and logs it
    seed: ${FEED_SEED:}
  house:
    # the simulated market maker quotes this far either side of the feed price, in
    # basis points across the whole spread; users can trade inside it with each other
    spread-bps: ${HOUSE_SPREAD_BPS:10}
    # price impact: trading depth-shares moves the price impact-bps, and size costs grow
    # with the square root of the shares (see PriceImpact). The lean fades by
    # impact-decay on each quote tick. The house also leans its quotes up to
    # imbalance-bps towards whichever side has more resting orders near the price.
    impact-bps: ${HOUSE_IMPACT_BPS:10}
    depth-shares: ${HOUSE_DEPTH_SHARES:500}
    impact-decay: ${HOUSE_IMPACT_DECAY:0.25}
    imbalance-bps: ${HOUSE_IMBALANCE_BPS:4}
  starting-cash: 100000.00
  # Demo reference prices; live mode will not execute against these seeds
  seed-quotes:
    AAPL: 232.15
    AMD: 152.20
    AMZN: 186.25
    COST: 878.95
    GOOGL: 172.40
    JPM: 205.10
    META: 512.30
    MSFT: 428.60
    NFLX: 675.40
    NVDA: 118.90
    TSLA: 244.70
    V: 271.85
